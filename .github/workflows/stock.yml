name: Bot de stock Pokémon

on:
  schedule:
    # S'exécute toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet le lancement manuel depuis l'onglet Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Indispensable pour donner les droits d'écriture au bot et éviter l'erreur 128
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install brotli

      - name: Exécuter le bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pokemon_stock_bot.py --once

      - name: Sauvegarder les produits découverts sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.txt discovered_products.txt stock_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: mise à jour des produits et de l'état" && git push)
