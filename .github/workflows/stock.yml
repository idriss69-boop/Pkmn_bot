name: Bot de stock Pokémon

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: pokemon-stock-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install brotli

      - name: Exécuter le bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pokemon_stock_bot.py --once

      - name: Préparer les fichiers de sauvegarde
        run: |
          touch discovered_products.txt

      - name: Sauvegarder les produits découverts sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add products.txt
          git add discovered_products.txt
          git add stock_state.json

          if git diff --cached --quiet; then
            echo "Aucun changement à sauvegarder."
            exit 0
          fi

          git commit -m "Auto: mise à jour des produits et de l'état"

          # Synchronisation avec GitHub sans rebase.
          # Les fichiers générés par cette exécution du bot restent prioritaires
          # en cas de conflit.
          git fetch origin main

          if ! git merge origin/main -X ours --no-edit; then
            echo "Conflit détecté pendant la synchronisation."

            for file in products.txt discovered_products.txt stock_state.json; do
              if git ls-files -u -- "$file" | grep -q .; then
                echo "Conservation de la version générée par le bot : $file"
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Un conflit subsiste sur un fichier non géré automatiquement."
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi

            git commit -m "Auto: résolution des sauvegardes du bot"
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Sauvegarde GitHub effectuée."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Le dépôt a changé. Nouvelle synchronisation (tentative $((attempt + 1))/3)..."
              git fetch origin main

              if ! git merge origin/main -X ours --no-edit; then
                echo "Nouveau conflit détecté."

                for file in products.txt discovered_products.txt stock_state.json; do
                  if git ls-files -u -- "$file" | grep -q .; then
                    git checkout --ours -- "$file"
                    git add "$file"
                  fi
                done

                if git diff --name-only --diff-filter=U | grep -q .; then
                  echo "Conflit non résolu sur un fichier non géré automatiquement."
                  git diff --name-only --diff-filter=U
                  git merge --abort
                  exit 1
                fi

                git commit -m "Auto: synchronisation des sauvegardes"
              fi
            fi
          done

          echo "Impossible de pousser les sauvegardes après 3 tentatives."
          exit 1