name: Bot de stock Pokémon

on:
  schedule:
    # S'exécute toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install brotli

      - name: Exécuter le bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pokemon_stock_bot.py --once

      - name: Préparer les fichiers de sauvegarde
        run: |
          touch discovered_products.txt

      - name: Sauvegarder les produits découverts sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add products.txt
          git add discovered_products.txt
          git add stock_state.json

          if git diff --cached --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -m "Auto: mise à jour des produits et de l'état"
            git push
          fi