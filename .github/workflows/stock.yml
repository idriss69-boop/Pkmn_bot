name: Bot de stock Pokémon

on:
  schedule:
    # S'exécute toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Évite que deux exécutions du bot se chevauchent et tentent
# de modifier GitHub en même temps.
concurrency:
  group: pokemon-stock-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install brotli

      - name: Exécuter le bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pokemon_stock_bot.py --once

      - name: Préparer les fichiers de sauvegarde
        run: |
          touch discovered_products.txt

      - name: Sauvegarder les produits découverts sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add products.txt
          git add discovered_products.txt
          git add stock_state.json

          if git diff --cached --quiet; then
            echo "Aucun changement à sauvegarder."
            exit 0
          fi

          git commit -m "Auto: mise à jour des produits et de l'état"

          # Le dépôt peut avoir reçu un commit entre le checkout et le push.
          # On récupère donc l'état distant et on rejoue notre commit dessus.
          git fetch origin main
          git rebase origin/main

          # Nouvelle tentative de push après synchronisation.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Sauvegarde GitHub effectuée."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Le dépôt a changé entre-temps. Nouvelle synchronisation (tentative $((attempt + 1))/3)..."
              git fetch origin main
              git rebase origin/main
            fi
          done

          echo "Impossible de pousser les sauvegardes après 3 tentatives."
          exit 1
